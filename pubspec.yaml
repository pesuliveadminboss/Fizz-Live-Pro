name: fizz_live_pro
description: A live streaming mobile app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6 # Lightweight state management & routing (modular-ku sema easy)
  zego_express_engine: ^3.16.0 # Live streaming core (adjust version as needed or use Zego UI kit)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-app: true
  assets:
    - assets/images/
    
