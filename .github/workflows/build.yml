name: Build Fizz Live Pro Release APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
      - name: Generate Android scaffold safely & patch v2 embedding/permissions
        run: |
          flutter create temp_app --platforms=android --project-name=fizz_live_pro
          cp -r temp_app/android ./android
          rm -rf temp_app
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          cat << 'EOF' > patch_manifest.py
          import re
          with open('android/app/src/main/AndroidManifest.xml', 'r') as f:
              content = f.read()
          
          perms = '''
          <uses-permission android:name="android.permission.INTERNET"/>
          <uses-permission android:name="android.permission.CAMERA"/>
          <uses-permission android:name="android.permission.RECORD_AUDIO"/>
          <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
          <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
          '''
          content = content.replace('<application', perms + '<application')
          content = content.replace('<activity', '<meta-data android:name="flutterEmbedding" android:value="2" />\n    <activity')
          
          with open('android/app/src/main/AndroidManifest.xml', 'w') as f:
              f.write(content)
          EOF
          python3 patch_manifest.py
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
