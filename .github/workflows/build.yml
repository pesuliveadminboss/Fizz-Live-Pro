name: Build Fizz Live Pro release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
      - name: Generate and copy Android scaffold properly
        run: |
          flutter create temp_app --platforms=android --project-name=fizz_live_pro
          mkdir -p android
          cp -r temp_app/android/* android/
          rm -rf temp_app
          sed -i 's/gradle-.*-all.zip/gradle-8.3-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true
          python3 - << 'EOF'
          import glob

          for path in glob.glob('android/**/*.gradle*', recursive=True):
              try:
                  with open(path, 'r', encoding='utf-8') as f:
                      text = f.read()
                  new_text = text.replace('7.3.0', '8.1.4')
                  if new_text != text:
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(new_text)
              except Exception:
                  pass

          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          try:
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              perms = '''
          <uses-permission android:name="android.permission.INTERNET"/>
          <uses-permission android:name="android.permission.CAMERA"/>
          <uses-permission android:name="android.permission.RECORD_AUDIO"/>
          <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
          <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
          '''
              if '<application' in content and 'INTERNET' not in content:
                  content = content.replace('<application', perms + '<application', 1)
              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(content)
          except Exception:
              pass
          EOF
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
