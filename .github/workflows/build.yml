name: Build Fizz Live Pro Debug APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
      - name: Generate and copy Android scaffold properly
        run: |
          flutter create temp_app --platforms=android --project-name=fizz_live_pro
          mkdir -p android
          cp -r temp_app/android/* android/
          rm -rf temp_app
          cat << 'EOF' > patch_manifest.py
          import os
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  content = f.read()
              perms = '''
          <uses-permission android:name="android.permission.INTERNET"/>
          <uses-permission android:name="android.permission.CAMERA"/>
          <uses-permission android:name="android.permission.RECORD_AUDIO"/>
          <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
          <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
          '''
              if '<application' in content and 'INTERNET' not in content:
                  content = content.replace('<application', perms + '<application')
              with open(manifest_path, 'w') as f:
                  f.write(content)
          EOF
          python3 patch_manifest.py
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          
