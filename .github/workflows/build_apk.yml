                                  const SizedBox(height: 6),
                                  Text(h['name']!, style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                                  Text(h['city']! + ' • ' + h['lvl']!, style: const TextStyle(color: Colors.white54, fontSize: 11)),
