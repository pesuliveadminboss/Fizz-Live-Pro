name: Build Release APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (Dart 3.5 Compatible)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Fix Package Name & SDK in Pubspec
        run: |
          sed -i 's/name: Fizz-Live-Pro/name: fizz_live_pro/g' pubspec.yaml || true
          sed -i 's/Fizz-Live-Pro/fizz_live_pro/g' pubspec.yaml || true
          sed -i "s/sdk: .*/sdk: '>=3.5.0 <4.0.0'/g" pubspec.yaml || true

      - name: Regenerate Clean Android Project (Safe for lib code)
        run: |
          mkdir -p /tmp/android_backup
          cp -f android/app/google-services.json /tmp/android_backup/ 2>/dev/null || true
          rm -rf android
          flutter create --platforms=android . --project-name=fizz_live_pro
          mkdir -p android/app
          cp -f /tmp/android_backup/google-services.json android/app/ 2>/dev/null || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-pub --no-version-check

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
