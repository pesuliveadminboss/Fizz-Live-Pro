name: Build Release APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Fix Package Name in Pubspec
        run: |
          sed -i 's/Fizz-Live-Pro/fizz_live_pro/g' pubspec.yaml || true

      - name: Patch Android v2 Embedding & Gradle Support
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:value="1"/android:value="2"/g' "$MANIFEST" || true
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion.*/minSdkVersion 21/g' android/app/build.gradle || true
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-pub --no-version-check

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
