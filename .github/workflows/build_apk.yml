name: Build Fizz Live Pro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Scaffold Android Files
        run: |
          flutter create . --org com.fizzlivepro.app --project-name fizz_live_pro

      - name: Set App Name & Launcher Icon
        run: |
          sed -i 's/android:label=".*"/android:label="Fizz Live Pro"/' android/app/src/main/AndroidManifest.xml || true
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          curl -s -L "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=192" -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FizzLivePro-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
