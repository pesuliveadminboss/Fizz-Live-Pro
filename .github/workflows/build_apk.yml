name: Build Release APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Fix Pubspec Package Name via Python & Clean Native
        run: |
          python3 -c "with open('pubspec.yaml', 'r') as f: c = f.read(); open('pubspec.yaml', 'w').write(c.replace('Fizz-Live-Pro', 'fizz_live_pro'))"
          rm -rf android ios

      - name: Create Native Scaffold
        run: flutter create --platforms=android .

      - name: Pub Get
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-pub

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
