name: Build Fizz Live Pro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Scaffold Android Files
        run: |
          flutter create . --org com.fizzlivepro.app --project-name fizz_live_pro
          sed -i 's/android:label=".*"/android:label="Fizz Live Pro"/' android/app/src/main/AndroidManifest.xml || true
          sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle || true
          echo "flutter.minSdkVersion=21" >> android/local.properties
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' android/app/src/main/AndroidManifest.xml || true

      - name: Create Clean Main Dart
        run: |
          python3 - << 'PYEOF'
          dart_code = """import 'package:flutter/material.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:zego_express_engine/zego_express_engine.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MaterialApp(debugShowCheckedModeBanner: false, home: Splash()));
          }

          class Splash extends StatefulWidget {
            const Splash({super.key});
            @override
            State<Splash> createState() => _SplashState();
          }

          class _SplashState extends State<Splash> {
            @override
            void initState() {
              super.initState();
              Future.delayed(const Duration(milliseconds: 1200), () {
                if (mounted) Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const PinGate()));
              });
            }
            @override
            Widget build(BuildContext context) {
              return const Scaffold(
                backgroundColor: Color(0xFF07070A),
                body: Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Icon(Icons.videocam_rounded, size: 75, color: Color(0xFFFF2E93)),
                      SizedBox(height: 16),
                      Text('FIZZ LIVE PRO', style: TextStyle(fontSize: 24, fontWeight: FontWeight.bold, letterSpacing: 3, color: Color(0xFFFFD700))),
                    ],
                  ),
                ),
              );
            }
          }

          class PinGate extends StatefulWidget {
            const PinGate({super.key});
            @override
            State<PinGate> createState() => _PinGateState();
          }

          class _PinGateState extends State<PinGate> {
            final _ctrl = TextEditingController();
            String _err = '';
            void _verify() {
              if (_ctrl.text.trim() == '7777') {
                Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const Login()));
              } else {
                setState(() => _err = 'Invalid PIN!');
                _ctrl.clear();
              }
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF07070A),
                body: Padding(
                  padding: const EdgeInsets.all(24.0),
                  child: Center(
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        const Icon(Icons.admin_panel_settings_rounded, size: 60, color: Color(0xFFFFD700)),
                        const SizedBox(height: 16),
                        const Text('Admin Verification (7777)', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.white)),
                        const SizedBox(height: 16),
                        TextField(
                          controller: _ctrl,
                          keyboardType: TextInputType.number,
                          obscureText: true,
                          textAlign: TextAlign.center,
                          maxLength: 4,
                          style: const TextStyle(color: Color(0xFFFFD700), fontSize: 24, letterSpacing: 8),
                          decoration: const InputDecoration(counterText: '', filled: true, fillColor: Color(0xFF14141E), hintText: '••••', border: OutlineInputBorder()),
                        ),
                        if (_err.isNotEmpty) Padding(padding: const EdgeInsets.only(top: 8), child: Text(_err, style: const TextStyle(color: Colors.redAccent))),
                        const SizedBox(height: 20),
                        SizedBox(
                          width: double.infinity,
                          height: 48,
                          child: ElevatedButton(
                            onPressed: _verify,
                            style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFFFD700), foregroundColor: Colors.black),
                            child: const Text('Unlock App', style: TextStyle(fontWeight: FontWeight.bold)),
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class Login extends StatelessWidget {
            const Login({super.key});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF07070A),
